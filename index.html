<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Angel35 Schritt für Schritt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Montageband: links die Stationen, Mitte die aktuelle Station mit Fragen, rechts die Drohne, die mit jeder Station wächst */
:root{
  --bg:#eef0f2; --panel:#ffffff; --ink:#1b1e22; --muted:#5b626b; --line:#d5d9de;
  --accent:#e2650f; --accent-ink:#fff; --accent-soft:#fde8d8;
  --ok:#1f7a3d; --ok-soft:#e1f2e6; --bad:#b3261e; --bad-soft:#fbe4e2; --info:#1f5fae; --info-soft:#e3edf9;
  --carbon:#2b2f35; --display:"Barlow Condensed","Arial Narrow",sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141619; --panel:#1f2226; --ink:#eceae6; --muted:#a2a8af; --line:#343941;
  --accent:#ff8a3d; --accent-ink:#1a1a1a; --accent-soft:#3a2617;
  --ok:#5cc47f; --ok-soft:#163021; --bad:#ff7b72; --bad-soft:#3b1b19; --info:#7fb2f0; --info-soft:#18273a; --carbon:#c9ced6; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#141619; --panel:#1f2226; --ink:#eceae6; --muted:#a2a8af; --line:#343941;
  --accent:#ff8a3d; --accent-ink:#1a1a1a; --accent-soft:#3a2617;
  --ok:#5cc47f; --ok-soft:#163021; --bad:#ff7b72; --bad-soft:#3b1b19; --info:#7fb2f0; --info-soft:#18273a; --carbon:#c9ced6; color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);-webkit-text-size-adjust:100%;text-size-adjust:100%;overflow-wrap:break-word}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
h1,h2,h3{font-family:var(--display);line-height:1.1;text-wrap:balance;margin:0}
p{margin:0}
img{max-width:100%;display:block}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
code{font-family:var(--mono);font-size:.85em;background:var(--bg);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}

header{background:var(--panel);border-bottom:1px solid var(--line)}
header .in{max-width:1320px;margin:0 auto;padding:14px 20px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;justify-content:space-between}
header h1{font-size:1.8rem}
header h1 span{color:var(--accent)}
.meter{display:flex;align-items:center;gap:10px;min-width:240px;flex:0 1 360px}
.meter .bar{flex:1;height:10px;border-radius:6px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.meter .bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .4s}
.meter span{font:500 .85rem var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums}

.layout{max-width:1320px;margin:0 auto;padding:20px;display:grid;grid-template-columns:250px minmax(0,1fr) 300px;gap:20px;align-items:start}
.layout > *{min-width:0}
.rail ol{min-width:0}

/* Stationen */
.rail{position:sticky;top:16px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.rail h2{font-size:1.05rem;color:var(--muted);padding:4px 8px 8px}
.rail ol{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.rail button{width:100%;display:grid;grid-template-columns:26px 1fr;gap:8px;align-items:center;text-align:left;background:none;border:0;border-radius:7px;padding:7px 8px;cursor:pointer;font-size:.9rem;line-height:1.25}
.rail button:hover{background:var(--bg)}
.rail button[aria-current="step"]{background:var(--accent-soft);font-weight:600}
.rail .st{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 .85rem var(--display);border:2px solid var(--line);color:var(--muted)}
.rail button.done .st{background:var(--ok);border-color:var(--ok);color:#fff}
.rail button[aria-current="step"] .st{border-color:var(--accent);color:var(--accent)}
.rail button.done[aria-current="step"] .st{color:#fff}
.rail .reset{margin-top:8px;width:100%;border:1px solid var(--line);background:none;border-radius:7px;padding:7px;cursor:pointer;font-size:.85rem;color:var(--muted)}

/* Station */
.station{display:grid;gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:20px}
.st-head{display:grid;grid-template-columns:auto 1fr;gap:2px 16px;align-items:end}
.st-no{font:700 3.4rem var(--display);color:var(--accent);line-height:.85;grid-row:span 2}
.st-kicker{font:500 .78rem var(--mono);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.st-head h2{font-size:2rem}
.st-goal{margin-top:12px;color:var(--muted);max-width:70ch}
.st-body{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;margin-top:16px}
.photo{background:#fff;border:1px solid var(--line);border-radius:8px;padding:8px;align-self:start}
.photo figcaption{font-size:.8rem;color:var(--muted);margin-top:4px;padding:0 2px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.fact{border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:.85rem;background:var(--bg)}
.fact b{font-family:var(--mono);font-weight:500;color:var(--accent);margin-right:4px}
ol.todo{margin:0;padding:0;list-style:none;counter-reset:t;display:grid;gap:8px}
ol.todo li{counter-increment:t;display:grid;grid-template-columns:28px 1fr;gap:10px}
ol.todo li::before{content:counter(t);font:700 1.25rem var(--display);color:var(--accent);line-height:1.3}
.warn{margin-top:14px;background:var(--bad-soft);border-left:4px solid var(--bad);border-radius:7px;padding:10px 12px;font-size:.93rem}
.warn b{display:block}

.questions h3{font-size:1.4rem;margin-bottom:4px}
.questions > p{color:var(--muted);font-size:.93rem;margin-bottom:12px}
.q{border:1px solid var(--line);border-radius:9px;padding:14px;background:var(--bg)}
.q + .q{margin-top:10px}
.q .qt{font-weight:600;margin-bottom:8px}
.q .qt span{font:500 .8rem var(--mono);color:var(--accent);margin-right:6px}
.opts{display:grid;gap:6px}
.opt{display:block;width:100%;min-height:44px;overflow-wrap:anywhere;text-align:left;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:var(--panel);cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--accent)}
.opt[disabled]{cursor:default}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);text-decoration:line-through}
.fb{margin-top:8px;font-size:.92rem;display:none}
.fb.show{display:block}
.fb.ok{color:var(--ok)} .fb.no{color:var(--bad)}
.nav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.btn{border:0;border-radius:8px;min-height:44px;padding:10px 18px;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.lock{font-size:.88rem;color:var(--muted)}

/* Drohne */
.side{position:sticky;top:16px;display:grid;gap:12px}
.drone{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px}
.drone h2{font-size:1.15rem;margin-bottom:4px}
.drone p{font-size:.82rem;color:var(--muted)}
.drone svg{width:100%;height:auto;display:block;margin-top:6px}
.layer{opacity:0;transition:opacity .5s}
.layer.on{opacity:1}
.legend{display:grid;gap:4px;font-size:.82rem;margin-top:6px}
.legend div{display:flex;gap:8px;align-items:center;color:var(--muted)}
.legend div.on{color:var(--ink)}
.legend i{width:10px;height:10px;border-radius:3px;flex:none}
.score{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:.9rem}
.score b{font:700 1.6rem var(--display);font-variant-numeric:tabular-nums;display:block}

/* Abschluss */
.finale{text-align:left}
.finale .tw{overflow-x:auto;margin-top:12px}.finale table{border-collapse:collapse;width:100%;font-size:.92rem}
.finale td,.finale th{padding:7px 9px;border-bottom:1px solid var(--line);text-align:left}
.finale td.n{font-variant-numeric:tabular-nums;text-align:right}

@media (max-width:1100px){.layout{grid-template-columns:220px minmax(0,1fr)}.side{grid-column:1/-1;position:static;grid-template-columns:1fr 1fr}}
@media (max-width:760px){
  header .in{padding:12px 16px;gap:8px}
  header h1{font-size:1.45rem}
  .meter{flex:1 1 100%;min-width:0}
  .layout{grid-template-columns:1fr;padding:12px 16px 90px;gap:12px}
  .rail{position:sticky;top:0;z-index:5;padding:8px;border-radius:0 0 10px 10px;margin:0 -16px;border-left:0;border-right:0;border-top:0}
  .rail h2,.rail .reset{display:none}
  .rail ol{grid-auto-flow:column;grid-auto-columns:max-content;overflow-x:auto;scroll-snap-type:x proximity;scrollbar-width:none;gap:4px}
  .rail ol::-webkit-scrollbar{display:none}
  .rail li{scroll-snap-align:center}
  .rail button{grid-template-columns:28px;padding:6px;min-height:44px;justify-items:center}
  .rail button > span:last-child{display:none}
  .rail button[aria-current="step"]{grid-template-columns:28px auto;padding:6px 10px 6px 6px}
  .rail button[aria-current="step"] > span:last-child{display:block;white-space:nowrap}
  .rail .st{width:28px;height:28px}
  .card{padding:16px}
  .st-no{font-size:2.6rem}
  .st-head h2{font-size:1.6rem}
  .st-body{grid-template-columns:1fr;gap:14px}
  .photo{order:-1;max-width:none}
  .photo img{max-height:220px;margin:0 auto;object-fit:contain}
  .questions h3{font-size:1.25rem}
  .q{padding:12px}
  .nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--panel);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));flex-wrap:nowrap}
  .nav .lock{display:none}
  .nav .btn{flex:1}
  .side{grid-template-columns:1fr;gap:12px}
  .drone svg{max-width:200px;margin:4px auto 0}
  .legend{grid-template-columns:1fr 1fr;gap:4px 10px}
  .nav .btn{white-space:nowrap;padding:10px 12px}
  .long{display:none}
}
.short{display:none}
@media (max-width:760px){.short{display:inline}}
@media (max-width:380px){
  .facts .fact{font-size:.8rem}
}
</style>
</head>

</div></header>

<div class="layout">

const LAYERS=[["frame","Rahmen","var(--carbon)"],["motors","Motoren","#d62828"],["power","Akkukabel + Kondensator","#f2b400"],["esc","ESC","#2b4c7e"],["rx","Empfänger","#6d2b8f"],["cam","Kamera","#f07800"],["vtx","Videosender","#8a3b12"],["fc","Flight Controller","#1f6b3a"],["ant","Antennen","#c0392b"],["setup","Betaflight eingerichtet","var(--ok)"],["props","Propeller","#8c96a0"]];

let state=S.get("state",{cur:0,ans:{}}); // ans["s-q"]={first:bool, done:bool, tried:[...]}
if(!state||typeof state.cur!=="number")state={cur:0,ans:{}};
const save=()=>S.set("state",state);
const key=(s,q)=>s+"-"+q;
const stationDone=i=>STATIONS[i].qs.every((_,q)=>state.ans[key(i,q)]&&state.ans[key(i,q)].done);
const FINAL=STATIONS.length;

function renderRail(){
  const ol=$("#rail");ol.innerHTML="";
  STATIONS.forEach((s,i)=>{
    const li=document.createElement("li"),b=document.createElement("button");
    b.type="button";b.className=stationDone(i)?"done":"";
    if(i===state.cur)b.setAttribute("aria-current","step");
    b.innerHTML=`<span class="st">${stationDone(i)?"✓":i+1}</span><span>${s.title}</span>`;
    b.onclick=()=>go(i);li.append(b);ol.append(li);
  });
  const li=document.createElement("li"),b=document.createElement("button");b.type="button";
  if(state.cur===FINAL)b.setAttribute("aria-current","step");
  b.innerHTML=`<span class="st">★</span><span>Auswertung</span>`;b.onclick=()=>go(FINAL);li.append(b);ol.append(li);
}
function renderDrone(){
  const on=new Set();STATIONS.forEach((s,i)=>{if(s.layer&&stationDone(i))on.add(s.layer);});
  document.querySelectorAll(".layer").forEach(g=>g.classList.toggle("on",on.has(g.dataset.layer)));
  $("#legend").innerHTML=LAYERS.map(([k,n,c])=>`<div class="${on.has(k)?"on":""}"><i style="background:${on.has(k)?c:"var(--line)"}"></i>${n}</div>`).join("");
  const done=STATIONS.filter((_,i)=>stationDone(i)).length;
  $("#meterBar").style.width=(done/STATIONS.length*100)+"%";$("#meterTxt").textContent=`${done} / ${STATIONS.length} Stationen`;
  const all=Object.values(state.ans).filter(a=>a.done),first=all.filter(a=>a.first).length;
  $("#scoreTxt").textContent=`${first} / ${all.length}`;
}
function renderStation(){
  const m=$("#station");
  if(state.cur===FINAL){renderFinal(m);return;}
  const i=state.cur,s=STATIONS[i];
  const qHtml=s.qs.map((q,qi)=>{
    const a=state.ans[key(i,qi)]||{tried:[]};
    const opts=q[1].map((o,oi)=>{let c="opt";if(a.done&&oi===q[2])c+=" right";else if((a.tried||[]).includes(oi))c+=" wrong";
      return `<button type="button" class="${c}" data-q="${qi}" data-o="${oi}" ${a.done||(a.tried||[]).includes(oi)?"disabled":""}>${o}</button>`;}).join("");
    const fb=a.done?`<p class="fb show ok">Richtig! ${q[3]}</p>`:(a.tried&&a.tried.length?`<p class="fb show no">Leider falsch – versuch es noch einmal.</p>`:`<p class="fb"></p>`);
    return `<div class="q" id="q${qi}"><p class="qt"><span>Frage ${qi+1}</span>${q[0]}</p><div class="opts" role="group" aria-label="Antworten zu Frage ${qi+1}">${opts}</div>${fb}</div>`;
  }).join("");
  const done=stationDone(i);
  m.innerHTML=`
  <article class="card">
    <div class="st-head"><span class="st-no">${String(i+1).padStart(2,"0")}</span><span class="st-kicker">${s.kicker}</span><h2>${s.title}</h2></div>
    <p class="st-goal">${s.goal}</p>
    <div class="st-body">
      <div><ol class="todo">${s.todo.map(t=>`<li><span>${t}</span></li>`).join("")}</ol>
        <div class="facts">${s.facts.map(f=>`<span class="fact"><b>${f[0]}</b>${f[1]}</span>`).join("")}</div>
        ${s.warn?`<div class="warn"><b>Achtung</b>${s.warn}</div>`:""}</div>
      <figure class="photo"><img src="${IMGS[s.img]}" alt="${s.cap}"><figcaption>${s.cap}</figcaption></figure>
    </div>
  </article>
  <section class="card questions"><h3>Kontrollfragen</h3><p>Beantworte beide Fragen richtig, dann ist die Station geschafft und das Bauteil erscheint an deiner Drohne.</p>${qHtml}</section>
  <div class="nav">
    <button class="btn ghost" type="button" id="prev" ${i===0?"disabled":""}>← Zurück</button>
    <span class="lock">${done?"Station geschafft.":"Noch nicht alle Fragen richtig beantwortet."}</span>
    <button class="btn" type="button" id="next" ${done?"":"disabled"}>${i===STATIONS.length-1?"Auswertung":"<span class=\"long\">Nächste Station</span><span class=\"short\">Weiter</span>"} →</button>
  </div>`;
  m.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(i,+b.dataset.q,+b.dataset.o));
  $("#prev").onclick=()=>go(i-1);$("#next").onclick=()=>go(i+1);
}
function answer(i,qi,oi){
  const k=key(i,qi),a=state.ans[k]||{tried:[],done:false};
  if(a.done)return;
  if(oi===STATIONS[i].qs[qi][2]){a.done=true;a.first=a.tried.length===0;}else a.tried.push(oi);
  state.ans[k]=a;save();renderAll();
  const el=document.querySelector(`#q${qi} .opt:not([disabled])`)||document.getElementById("next");if(el&&!el.disabled)el.focus();
}
function renderFinal(m){
  const rows=STATIONS.map((s,i)=>{const n=s.qs.filter((_,q)=>{const a=state.ans[key(i,q)];return a&&a.done&&a.first;}).length;
    return `<tr><td>${i+1}. ${s.title}</td><td>${stationDone(i)?"geschafft":"offen"}</td><td class="n">${n} / ${s.qs.length}</td></tr>`;}).join("");
  const total=STATIONS.reduce((t,s)=>t+s.qs.length,0);
  const first=Object.values(state.ans).filter(a=>a.done&&a.first).length;
  const allDone=STATIONS.every((_,i)=>stationDone(i));
  const pct=Math.round(first/total*100);
  const verdict=!allDone?"Es fehlen noch Stationen. Arbeite sie in der Liste links ab.":pct>=80?"Stark! Du kennst den Aufbau der Angel35 sehr genau und bist bereit für die Werkbank.":pct>=60?"Gut gemacht. Schau dir die Stationen mit wenigen Punkten noch einmal an.":"Geschafft, aber mit vielen Fehlversuchen. Geh die Stationen noch einmal durch, bevor du lötest.";
  m.innerHTML=`<article class="card finale">
    <div class="st-head"><span class="st-no">★</span><span class="st-kicker">Auswertung</span><h2>${allDone?"Drohne fertig gebaut":"Noch nicht fertig"}</h2></div>
    <p class="st-goal">${verdict}</p>
    <div class="facts"><span class="fact"><b>${first} / ${total}</b>beim ersten Versuch richtig</span><span class="fact"><b>${pct} %</b>Trefferquote</span></div>
    <div class="tw"><table><thead><tr><th>Station</th><th>Status</th><th>Erster Versuch</th></tr></thead><tbody>${rows}</tbody></table></div>
  </article>
  <div class="nav"><button class="btn ghost" type="button" id="prev">← Letzte Station</button><button class="btn" type="button" id="restart">Von vorne beginnen</button></div>`;
  $("#prev").onclick=()=>go(STATIONS.length-1);$("#restart").onclick=resetAll;
}
function go(i){state.cur=Math.max(0,Math.min(FINAL,i));save();renderAll();window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}
function resetAll(){S.clear();state={cur:0,ans:{}};renderAll();}
function renderAll(){renderRail();renderStation();renderDrone();const c=document.querySelector('.rail [aria-current="step"]');if(c&&c.scrollIntoView&&matchMedia('(max-width:760px)').matches){try{c.scrollIntoView({block:'nearest',inline:'center'});}catch(e){}}}
$("#resetAll").onclick=resetAll;
renderAll();
})();
</script>
</body>
</html>
